# Manual runner availability probe for macOS. This workflow is kept out of push paths
# so it checks runner capacity without kicking the full iOS CI.

name: runner-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-12, macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: OS check
        run: |
          set -eu
          uname -a
          sw_vers
      - name: Xcode check
        run: |
          set -eu
          xcode-select -p
          xcodebuild -version | head -n 2
