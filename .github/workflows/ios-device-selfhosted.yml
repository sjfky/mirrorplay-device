# Build the iOS device app on a self-hosted / cloud macOS runner.
#
# Register the runner with the three labels below before running this workflow:
#
#   ./config.sh --url <repo> --token <runner-token> --name mac-cloud-01 --labels macOS,ios-build --trust
#
# Without Apple developer credentials this job can still produce the unsigned Payload container.
# With them it can try to export the signed .ipa. It never labels an unsigned container as signed.

name: ios-device-selfhosted

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: 'Apple developer Team ID — leave empty for an unsigned container'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/ios-device-selfhosted.yml'

permissions:
  contents: read

jobs:
  ios-app:
    runs-on: [self-hosted, macOS, ios-build]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify macOS runner capacity
        run: |
          set -eu
          uname -a
          sw_vers
          xcode-select -p
          swift --version
          xcodebuild -version

      - name: Install xcodegen if missing
        run: |
          set -eu
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Swift device parity tests
        working-directory: device-ios
        run: swift test

      - name: Generate Xcode project from project.yml
        working-directory: device-ios
        run: xcodegen generate

      - name: Build unsigned or sign-enabled archive
        working-directory: device-ios
        env:
          TEAM_ID: ${{ inputs.team_id }}
        run: |
          set -eu
          if [ -n "${TEAM_ID:-}" ]; then
            xcodebuild -project mirrorplay-device.xcodeproj -scheme mirrorplay-device \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/mirrorplay-device.xcarchive \
              DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
              clean build archive
          else
            xcodebuild -project mirrorplay-device.xcodeproj -scheme mirrorplay-device \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/mirrorplay-device.xcarchive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              clean build archive
          fi

      - name: Package unsigned Payload container
        working-directory: device-ios
        run: |
          set -eu
          app=build/mirrorplay-device.xcarchive/Products/Applications/mirrorplay-device.app
          test -d "$app" || { echo "::error::no bundle at $app — Xcode build did not produce one" >&2; exit 4; }
          sh package-ipa.sh "$app" build/mirrorplay-unsigned.ipa

      - name: Upload unsigned container
        uses: actions/upload-artifact@v4
        with:
          name: mirrorplay-unsigned-ipa-selfhosted
          path: device-ios/build/mirrorplay-unsigned.ipa
          if-no-files-found: error

      - name: Export signed .ipa only when the identity is really configured
        if: ${{ inputs.team_id != '' }}
        working-directory: device-ios
        env:
          TEAM_ID: ${{ inputs.team_id }}
          P12_BASE64: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -eu
          if [ -z "${P12_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ]; then
            echo "TEAM_ID was given, but the signing cert secrets are incomplete."
            echo "Stopping rather than calling an unsigned artifact signed."
            exit 5
          fi
          KEYCHAIN=ios-selfhosted-runner.keychain
          security create-keychain -p runner "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/mirrorplay-device.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
          codesign --verify --verbose=2 build/ipa/mirrorplay-device.ipa

      - name: Upload signed .ipa artifact
        if: ${{ inputs.team_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mirrorplay-signed-ipa-selfhosted
          path: device-ios/build/ipa
          if-no-files-found: error
