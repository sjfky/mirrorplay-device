<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SPDX-FileCopyrightText: 2026 mirrorplay contributors
       SPDX-License-Identifier: AGPL-3.0-only
       The source of the home-screen icons. The PNGs beside this file are rendered from it by
       scripts/build-icons.mjs, because iOS installs a bitmap, not a vector. -->
  <rect width="512" height="512" fill="#0a0d11"/>
  <g stroke="#0a3b2c" stroke-width="4" fill="none">
    <rect x="40" y="96" width="432" height="320" rx="40" fill="#101a20"/>
  </g>
  <!-- the dashboard: one wide screen and the phone that feeds it -->
  <rect x="72" y="132" width="284" height="248" rx="20" fill="#0f2f26"/>
  <rect x="72" y="132" width="284" height="248" rx="20" fill="none" stroke="#4fd1a5" stroke-width="5"/>
  <g fill="#4fd1a5" opacity="0.85">
    <rect x="104" y="176" width="220" height="16" rx="8"/>
    <rect x="104" y="212" width="168" height="12" rx="6" opacity="0.7"/>
    <rect x="104" y="244" width="196" height="12" rx="6" opacity="0.5"/>
  </g>
  <!-- touch, coming back: a finger mark inside the head unit's frame -->
  <circle cx="214" cy="322" r="34" fill="none" stroke="#f2b544" stroke-width="9"/>
  <circle cx="214" cy="322" r="9" fill="#f2b544"/>
  <!-- the phone on the right, sending -->
  <rect x="380" y="196" width="72" height="124" rx="14" fill="#101a20" stroke="#4fd1a5" stroke-width="5"/>
  <rect x="392" y="212" width="48" height="76" rx="6" fill="#1c3a33"/>
  <path d="M366 258 L340 258" stroke="#93a0b0" stroke-width="6" stroke-linecap="round"/>
</svg>
